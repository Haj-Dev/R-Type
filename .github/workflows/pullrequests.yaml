name: Pull request checks

on:
  pull_request:
    branches:
      - main
      - dev
    paths-ignore:
      - docs/**
      - .github/**
      - README.md

permissions:
  contents: write

jobs:
  # ---------- Job 1: compile ----------
  build-and-lint:
    name: Build & Lint
    runs-on: self-hosted
    container:
      image: inkurey22/epitest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: Build
        run: ./build.sh

      - name: Run clang-tidy with fixes
        run: ./lint.sh

      - name: Commit and push lint fixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "No lint changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "ci: apply clang-tidy fixes"
          git push

  # ---------- Job 3: clang-format, commit & push ----------
  format:
    name: Format
    needs: lint
    runs-on: self-hosted
    container:
      image: inkurey22/epitest

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply clang-format
        run: ./format.sh

      - name: Commit and push formatting changes
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          if git diff --quiet; then
            echo "No formatting changes"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "ci: apply clang-format"
          git push
