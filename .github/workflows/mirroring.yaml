name: CI

on:
  push:
    branches: [main]

jobs:
  # Runs only when this workflow executes on the base (source-of-truth) repo.
  # Pushes the current state to a mirror remote.
  mirror:
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: Push mirror to other remote
        env:
          MIRROR_URL: git@github.com:EpitechPGE3-2026/G-CCP-500-LIL-5-1-rtype-2.git
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add mirror "$MIRROR_URL"
          git push mirror --all --force
          git push mirror --tags --force

