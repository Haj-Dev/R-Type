name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.commit.outputs.tag }}
      title: ${{ steps.commit.outputs.title }}
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Prepare commit release name
        id: commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n '1p')"

          if [[ ! "$title" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Commit name must be a semantic version such as v1.2.3; got: $title" >&2
            exit 1
          fi

          {
            echo "tag=$title"
            echo "title<<EOF"
            echo "$title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push release tag
        env:
          TAG: ${{ steps.commit.outputs.tag }}
        run: |
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; nothing to do."
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "$TAG"
          fi

  build-linux:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: inkurey22/epitest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Linux
        run: ./build.sh release

      - name: Package Linux build
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          mkdir rtype
          cp build/release/r-type_server build/release/r-type_client rtype
          cp -r assets rtype
          zip -r "rtype-linux-${VERSION}.zip" rtype

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: Linux-build
          path: rtype-linux-*.zip
          retention-days: 30

  build-windows:
    needs: prepare
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Windows
        shell: pwsh
        run: ./build.ps1 release

      - name: Package Windows build
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.tag }}
        run: |
          New-Item -ItemType Directory -Path rtype | Out-Null
          Copy-Item build\release\r-type_server.exe, build\release\r-type_client.exe -Destination rtype
          Copy-Item assets -Destination rtype -Recurse
          Compress-Archive -Path rtype -DestinationPath "rtype-windows-$env:VERSION.zip"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Windows-build
          path: rtype-windows-*.zip
          retention-days: 30

  mirror:
    needs: [prepare, build-linux, build-windows]
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: Push mirror to other remote
        env:
          MIRROR_URL: git@github.com:EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-2.git
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add mirror "$MIRROR_URL"
          git push mirror --all --force
          git push mirror --tags --force

  release:
    needs: [prepare, build-linux, build-windows, mirror]
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    steps:
      - name: Download packaged build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          pattern: "*-build"
          merge-multiple: true

      - name: Create source release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TITLE: ${{ needs.prepare.outputs.title }}
        run: |
          gh release create "$TAG" \
            --repo "$REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            "release-assets/rtype-linux-$TAG.zip" \
            "release-assets/rtype-windows-$TAG.zip"
