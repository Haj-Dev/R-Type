name: CI

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  # Runs only when this workflow executes on the base (source-of-truth) repo.
  # Pushes the current state to a mirror remote.
  mirror:
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.MIRROR_SSH_PRIVATE_KEY }}

      - name: Push mirror to other remote
        env:
          MIRROR_URL: git@github.com:EpitechPGE3-2026/G-ING-500-LIL-5-1-rtype-2.git
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          git remote add mirror "$MIRROR_URL"
          git push mirror --all --force
          git push mirror --tags --force

  release:
    if: github.repository == 'Haj-Dev/R-Type'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare commit release name
        id: commit
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          title="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -n '1p')"

          if [[ ! "$title" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Commit name must be a semantic version such as v1.2.3; got: $title" >&2
            exit 1
          fi

          {
            echo "tag=$title"
            echo "title<<EOF"
            echo "$title"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Create release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.commit.outputs.tag }}
          TITLE: ${{ steps.commit.outputs.title }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; nothing to do."
            exit 0
          fi

          gh release create "$TAG" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes

